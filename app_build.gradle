plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kuro.companionctl'
    compileSdk 34

    defaultConfig {
        applicationId "com.kuro.companionctl"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'kurocontrol'
            keyAlias 'kuro'
            keyPassword 'kurocontrol'
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
